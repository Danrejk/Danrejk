name: Update README

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Activity and Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Danrejk
        run: |
          python - << 'EOF'
          import os
          import re
          import urllib.request
          import json

          username = os.environ.get("USERNAME", "Danrejk")
          token = os.environ.get("GH_TOKEN")

          url = f"https://api.github.com/users/{username}/events/public?per_page=30"
          req = urllib.request.Request(url, headers={
              "User-Agent": "GitHub-Actions",
              "Authorization": f"Bearer {token}"
          })

          try:
              with urllib.request.urlopen(req) as response:
                  events = json.loads(response.read().decode())
          except Exception as e:
              print(f"Error fetching events: {e}")
              exit(1)

          lines = []
          for ev in events:
              if len(lines) >= 5:
                  break
              
              ev_type = ev.get("type")
              repo_name = ev.get("repo", {}).get("name")
              repo_url = f"https://github.com/{repo_name}"

              if ev_type == "PushEvent":
                  commits = ev.get("payload", {}).get("commits", [])
                  count = len(commits)
                  commit_msg = commits[0]["message"].split("\n")[0] if commits else "commits"
                  lines.append(f"🔨 Pushed {count} commit{'s' if count != 1 else ''} to [{repo_name}]({repo_url})")
              
              elif ev_type == "PullRequestEvent":
                  action = ev.get("payload", {}).get("action")
                  pr = ev.get("payload", {}).get("pull_request", {})
                  pr_num = pr.get("number")
                  pr_url = pr.get("html_url")
                  if action == "opened":
                      lines.append(f"💪 Opened PR [#{pr_num}]({pr_url}) in [{repo_name}]({repo_url})")
                  elif action == "closed" and pr.get("merged"):
                      lines.append(f"🎉 Merged PR [#{pr_num}]({pr_url}) in [{repo_name}]({repo_url})")

              elif ev_type == "CreateEvent":
                  ref_type = ev.get("payload", {}).get("ref_type")
                  ref = ev.get("payload", {}).get("ref")
                  if ref_type == "repository":
                      lines.append(f"⭐ Created repository [{repo_name}]({repo_url})")
                  elif ref_type == "branch":
                      lines.append(f"🌱 Created branch `{ref}` in [{repo_name}]({repo_url})")

              elif ev_type == "IssuesEvent":
                  action = ev.get("payload", {}).get("action")
                  issue = ev.get("payload", {}).get("issue", {})
                  num = issue.get("number")
                  issue_url = issue.get("html_url")
                  lines.append(f"🗣️ {action.capitalize()} issue [#{num}]({issue_url}) in [{repo_name}]({repo_url})")

          if not lines:
              print("No eligible activity found.")
              exit(0)

          formatted_activity = "\n".join(f"{i+1}. {line}" for i, line in enumerate(lines))

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r"(<!--START_SECTION:activity-->)(.*?)(<!--END_SECTION:activity-->)"
          replacement = f"\\1\n{formatted_activity}\n\\3"
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          if new_content != content:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("README updated successfully.")
          else:
              print("No changes needed in README.")
          EOF

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update recent activity" && git push)
